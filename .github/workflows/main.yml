name: Copilot PR Review

on:
  pull_request:
    types: [labeled]

jobs:
  copilot-review:
    if: github.event.label.name == 'CoPilot Review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Copilot Review & Update Labels
        uses: actions/github-script@v9
        with: 
          # anders negeert Copilot het verzoek (bot filter)
          github-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;

            let reviewSuccessful = false;

            try {
              // 1. Vraag de review aan via de correcte Octokit functie: requestReviewers
              // Note: als Copilot als team of app werkt, gebruik eventueel team_reviewers of gh pr comment
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: ['copilot'] // of de specifieke GitHub App slug
              });

              reviewSuccessful = true;
              console.log('Copilot review succesvol aangevraagd.');
            } catch (error) {
              console.error('Fout bij aanvragen Copilot review:', error.message);
              // Als requestReviewers faalt voor Copilot in jouw specifieke organisatie, 
              // proberen we de fallback comment methode:
              try {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body: '@github-copilot review'
                });
                reviewSuccessful = true;
              } catch (commentError) {
                core.setFailed(`Review mislukt: ${commentError.message}`);
              }
            } finally {
              // 2. DIT DEEL DRAAIT ALTIJD (OOK BIJ FOUTEN)
              
              // Verwijder ALTIJD het 'CoPilot Review' label
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pull_number,
                  name: 'CoPilot Review'
                });
                console.log("Label 'CoPilot Review' verwijderd.");
              } catch (e) {
                console.warn("Kon 'CoPilot Review' label niet verwijderen (mogelijk al weg):", e.message);
              }

              // Voeg ALLEEN 'CoPilot Reviewed' toe ALS de review is gelukt
              if (reviewSuccessful) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pull_number,
                  labels: ['CoPilot Reviewed']
                });
                console.log("Label 'CoPilot Reviewed' toegevoegd.");
              }
            }
