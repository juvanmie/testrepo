name: Copilot PR Review Flow

on:
  pull_request:
    types: [labeled]

jobs:
  copilot-review:
    # Run only when the 'CoPilot Review' label is added
    if: github.event.label.name == 'CoPilot Review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # STEP 1: Request the Copilot review
      - name: Trigger Copilot Review
        id: review
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;

            try {
              // Try requesting reviewer via API
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: ['copilot']
              });
              console.log('Successfully requested Copilot review via API.');
            } catch (error) {
              console.error('API request failed, attempting comment fallback:', error.message);

              // Fallback method: Post @github-copilot comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: '@github-copilot review'
              });
              console.log('Successfully triggered Copilot review via comment fallback.');
            }

      # STEP 2: ALWAYS remove the trigger label (runs regardless of Step 1 success/failure)
      - name: Remove 'CoPilot Review' Label
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'CoPilot Review'
              });
              console.log("Label 'CoPilot Review' removed.");
            } catch (error) {
              console.warn("Could not remove 'CoPilot Review' label:", error.message);
            }

      # STEP 3: Add the success label ONLY if Step 1 succeeded
      - name: Add 'CoPilot Reviewed' Label
        if: steps.review.outcome == 'success'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['CoPilot Reviewed']
            });
            console.log("Label 'CoPilot Reviewed' added.");
