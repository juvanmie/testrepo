name: Copilot PR Review

on:
  pull_request:
    types: [labeled]

jobs:
  # JOB 1: Triggers the Copilot Review
  trigger-copilot-review:
    if: github.event.label.name == 'CoPilot Review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Request Copilot Review
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;

            try {
              // Primary method: Request reviewer via API
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: ['copilot']
              });
              console.log('Successfully requested Copilot review via API.');
            } catch (error) {
              console.error('API request failed, attempting fallback comment method:', error.message);
              
              // Fallback method: Post @github-copilot comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: '@github-copilot review'
              });
              console.log('Successfully triggered Copilot review via comment fallback.');
            }

  # JOB 2: Handles label management (Runs after Job 1)
  manage-labels:
    needs: trigger-copilot-review
    # Ensures this job runs regardless of whether Job 1 succeeded, failed, or was cancelled
    if: always() && github.event.label.name == 'CoPilot Review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Update PR Labels
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            
            // Check if Job 1 succeeded using the needs object
            const reviewOutcome = '${{ needs.trigger-copilot-review.result }}';
            console.log(`Review job status: ${reviewOutcome}`);

            // 1. ALWAYS remove the trigger label
            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: 'CoPilot Review'
              });
              console.log("Label 'CoPilot Review' removed.");
            } catch (error) {
              console.warn("Could not remove 'CoPilot Review' label:", error.message);
            }

            // 2. Add 'CoPilot Reviewed' ONLY if the review job succeeded
            if (reviewOutcome === 'success') {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: ['CoPilot Reviewed']
              });
              console.log("Label 'CoPilot Reviewed' added.");
            } else {
              console.log("Skipped adding 'CoPilot Reviewed' label because review job did not succeed.");
            }
